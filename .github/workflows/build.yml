name: Build 12 Estereo APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Ver archivos
        run: |
          echo "=== ARCHIVOS DEL REPOSITORIO ==="
          ls -lah
          echo "=== ARCHIVOS ZIP ==="
          find . -maxdepth 1 -type f -iname "*.zip" -print

      - name: Encontrar y descomprimir proyecto
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró ningún archivo ZIP."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          unzip -o "$ZIP"

          echo "=== CONTENIDO ==="
          ls -lah

      - name: Buscar carpeta de Android
        run: |
          echo "=== BUSCANDO PROYECTO ==="
          find . -maxdepth 3 -type f \( -name "build.gradle" -o -name "settings.gradle" -o -name "gradlew" \) -print

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses || true

      - name: Compilar APK
        working-directory: 12EstereoApp
        run: |
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: 12Estereo-APK
          path: 12EstereoApp/app/build/outputs/apk/debug/*.apk
