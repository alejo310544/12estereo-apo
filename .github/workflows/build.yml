name: Build 12 Estereo APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          unzip -o 12Estereo_Android_Project.zip
          ls -la 12EstereoApp

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses || true

      - name: Compilar APK
        working-directory: 12EstereoApp
        run: |
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: 12Estereo-APK
          path: 12EstereoApp/app/build/outputs/apk/debug/*.apk
