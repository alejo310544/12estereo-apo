name: Build 12 Estereo APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Ver archivos
        run: |
          echo "=== ARCHIVOS DEL REPOSITORIO ==="
          ls -lah

          echo "=== ARCHIVOS ZIP ==="
          find . -maxdepth 1 -type f -iname "*.zip" -print

      - name: Encontrar y descomprimir proyecto
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró ningún archivo ZIP."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          unzip -o "$ZIP"

          echo "=== CONTENIDO DEL PROYECTO ==="
          ls -lah

      - name: Buscar carpeta de Android
        run: |
          echo "=== BUSCANDO PROYECTO ANDROID ==="

          find . -maxdepth 4 -type f \
            \( -name "build.gradle" -o -name "settings.gradle" \) \
            -print

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          yes | sdkmanager --licenses || true

          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Crear carpetas Android necesarias
        run: |
          mkdir -p 12EstereoApp/app/src/debug/java
          mkdir -p 12EstereoApp/app/src/debug/res

          echo "=== CARPETAS CREADAS ==="
          find 12EstereoApp/app/src -maxdepth 3 -type d -print

      - name: Compilar APK
        working-directory: 12EstereoApp
        run: |
          echo "=== INICIANDO COMPILACION ==="
          gradle assembleDebug --stacktrace

      - name: Verificar APK
        run: |
          echo "=== APK GENERADO ==="
          find 12EstereoApp/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: 12Estereo-APK
          path: 12EstereoApp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
